<!DOCTYPE html>
<html lang="es" data-theme="coursicle-soft">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mi Horario</title>
<meta name="theme-color" content="#2E7CF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horario">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ESTRUCTURALES (sin color, iguales en todos los temas) ============
   Los tokens de color/superficie viven en src/themes/*.css, uno por tema,
   aplicados vía [data-theme="..."] en <html>. Ver src/themes/theme.js. */
:root{
  --row-h:64px;--head-h:44px;--time-w:42px;--day-w:130px;

  /* iOS-style easing curves */
  --ease-out:cubic-bezier(.4,0,.2,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --ease-spring:cubic-bezier(.32,.72,0,1);
  --ease-snap:cubic-bezier(.22,1,.36,1);

  --theme-t:background-color .38s var(--ease-out),border-color .38s var(--ease-out),color .38s var(--ease-out),box-shadow .38s var(--ease-out);
}
/* ============ RESET ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;transition:var(--theme-t)}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.page{max-width:560px;margin:0 auto}

/* ============ ENTRANCE ANIMATION ============ */
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.hero,.today-card,.week-row,.cal-wrap,.sec-head,.todo-list,.todo-empty{
  animation:slideUp .5s var(--ease-out) both;
}
.hero{animation-delay:0s}
.today-card{animation-delay:.05s}
.week-row{animation-delay:.1s}
.cal-wrap{animation-delay:.15s}
.sec-head{animation-delay:.2s}
.todo-list,.todo-empty{animation-delay:.25s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ HEADER ============ */
.hero{padding:calc(24px + env(safe-area-inset-top)) 20px 0;display:flex;align-items:flex-start;justify-content:space-between}
.hero-left .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--terracotta);margin-bottom:5px}
.hero-left h1{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:32px;line-height:1.08;letter-spacing:-.01em;translate:0 var(--parallax,0)}
.theme-toggle{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-border);
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--glass-inset),var(--glass-sh);
  transition:transform .12s var(--ease-out),var(--theme-t);
  margin-top:4px;
}
.theme-toggle:active{transform:scale(.86)}

/* ============ TODAY CARD ============ */
.today-card{
  margin:14px 20px 0;padding:16px 18px;border-radius:20px;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:var(--card-blur);-webkit-backdrop-filter:var(--card-blur);
  box-shadow:var(--glass-inset),var(--glass-sh);position:relative;overflow:hidden;
  transition:var(--theme-t);
}
.today-card::before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;
  background:linear-gradient(145deg,rgba(232,196,184,.35),rgba(255,255,255,.1),rgba(184,115,85,.12));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.today-greeting{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:17px;margin-bottom:5px}
.today-detail{font-size:12.5px;color:var(--ink2);line-height:1.5}
.today-detail b{color:var(--terracotta);font-weight:700}
[data-theme="dark"] .today-detail b{text-shadow:var(--glow) var(--terracotta)}

.week-row{display:flex;align-items:center;gap:10px;margin:12px 20px 0;padding:0 2px}
.week-bar{flex:1;height:5px;border-radius:99px;background:var(--line);transition:var(--theme-t)}
.week-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--terracotta));transition:width .5s var(--ease-out)}
[data-theme="dark"] .week-fill{box-shadow:0 0 12px -2px var(--terracotta)}
.week-lbl{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}

/* ============ CALENDAR GRID ============ */
.cal-wrap{
  margin:16px 0 0;padding:0 0 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;
}
.cal-inner{padding-right:20px}
.cal-grid{display:grid;position:relative}

.col-head{
  grid-row:1;position:sticky;top:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:13px;
  background:var(--bg);border-bottom:1px solid var(--line);
  scroll-snap-align:start;transition:var(--theme-t);
}
.col-head .d{font-size:9px;font-family:'Inter',sans-serif;font-style:normal;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.col-head.is-today{background:rgba(184,115,85,.07)}
[data-theme="dark"] .col-head.is-today{background:rgba(184,115,85,.12)}
.col-head.is-today .d{color:var(--terracotta)}

.time-lbl{
  grid-column:1;display:flex;align-items:flex-start;justify-content:flex-end;
  padding:2px 5px 0 0;font-size:9.5px;font-weight:700;color:var(--ink2);
  border-right:1px solid var(--line);
}
.g-line{grid-column:2/-1;border-top:1px solid var(--line);align-self:start;height:0}

/* --- Glass class block --- */
.c-block{
  position:relative;margin:2px 3px;padding:8px 9px;border-radius:14px;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:var(--glass-inset),var(--glass-sh);overflow:hidden;
  cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:transform .14s var(--ease-out),box-shadow .14s var(--ease-out),var(--theme-t);
  display:flex;flex-direction:column;justify-content:space-between;
}
.c-block::before{content:"";position:absolute;top:0;left:0;width:3.5px;height:100%;border-radius:3px 0 0 3px;background:var(--terracotta)}
.c-block.is-online::before{background:var(--rose)}
.c-block.is-custom::before{background:var(--tag-green)}
.c-block:active{transform:scale(.94);box-shadow:0 1px 4px rgba(42,35,32,.08)}
.c-block .bt{font-size:9px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.c-block .bn{font-size:11px;font-weight:600;line-height:1.25;margin:2px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-block .br{font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--terracotta);opacity:.85}
.c-block.is-online .br{color:var(--rose-deep)}
.c-block .tap-hint{position:absolute;bottom:5px;right:7px;font-size:10px;color:var(--ink2);opacity:.4}
.c-block .n-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px var(--glass)}
[data-theme="dark"] .c-block .n-dot{box-shadow:0 0 8px -1px currentColor,0 0 0 2px var(--glass)}

/* --- Empty cell tap zone --- */
.add-cell{
  margin:2px 3px;border-radius:14px;border:1.5px dashed var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .18s var(--ease-out),border-color .18s var(--ease-out),transform .1s var(--ease-out);
}
.add-cell:active{background:rgba(184,115,85,.08);border-color:var(--terracotta);transform:scale(.96)}
.add-cell span{font-size:20px;color:var(--ink2);opacity:.3}
.add-cell:active span{opacity:.7}

/* --- Now line --- */
.now-line{position:absolute;height:2px;background:var(--terracotta);border-radius:2px;z-index:6;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--terracotta)}
[data-theme="dark"] .now-line{box-shadow:0 0 14px -2px var(--terracotta)}
[data-theme="dark"] .now-line::before{box-shadow:0 0 10px 0 var(--terracotta)}

/* ============ TODO ============ */
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 10px}
.sec-title{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:18px}
.add-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--glass-border);
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--terracotta);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--glass-inset),var(--glass-sh);
  transition:transform .12s var(--ease-out),var(--theme-t);
}
.add-btn:active{transform:scale(.86)}

.todo-list{padding:0 20px 6px;display:flex;flex-direction:column;gap:6px}

/* Swipeable todo item */
.todo-shell{
  position:relative;border-radius:14px;overflow:hidden;
}
.todo-actions-l,.todo-actions-r{
  position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;width:88px;color:#F5EFE8;
}
.todo-actions-l{left:0;background:linear-gradient(90deg,var(--tag-green),#8BB88C)}
.todo-actions-r{right:0;background:linear-gradient(90deg,#D67E78,var(--tag-coral))}
[data-theme="dark"] .todo-actions-l{box-shadow:inset 0 0 20px rgba(123,168,124,.3)}
[data-theme="dark"] .todo-actions-r{box-shadow:inset 0 0 20px rgba(196,114,108,.3)}

.todo-item{
  position:relative;
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--glass-inset),var(--glass-sh);
  transition:var(--theme-t);
  touch-action:pan-y;
  will-change:transform;
}
.todo-item.dragging{transition:none}
.todo-check{
  flex:0 0 auto;width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line);
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s var(--ease-out);margin-top:1px;
}
.todo-check.done{background:var(--terracotta);border-color:var(--terracotta)}
[data-theme="dark"] .todo-check.done{box-shadow:0 0 10px -2px var(--terracotta)}
.todo-check.done::after{content:"✓";color:var(--bg);font-size:11px;font-weight:700}
.todo-text{flex:1;font-size:13.5px;line-height:1.4;word-break:break-word}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--ink2)}
.todo-empty{padding:4px 20px 0;font-size:12.5px;color:var(--ink2);font-style:italic}

.todo-input-row{
  display:flex;gap:8px;padding:0 20px;margin-bottom:6px;
  overflow:hidden;max-height:0;
  transition:max-height .3s var(--ease-out),margin .3s var(--ease-out),padding .3s var(--ease-out);
}
.todo-input-row.open{max-height:60px;margin-bottom:10px}
.todo-input-row input{
  flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--glass-border);
  background:var(--surface);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);outline:none;
  transition:border-color .18s,var(--theme-t);
}
.todo-input-row input:focus{border-color:var(--rose-deep)}
.todo-input-row button{
  padding:0 16px;border-radius:12px;border:none;background:var(--terracotta);color:#F5EFE8;
  font-size:13px;font-weight:600;cursor:pointer;
  transition:transform .12s var(--ease-out);
}
.todo-input-row button:active{transform:scale(.94)}

/* ============ BACKDROP + SHEET ============ */
.backdrop{position:fixed;inset:0;background:rgba(42,35,32,.36);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s var(--ease-out);z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
[data-theme="dark"] .backdrop{background:rgba(0,0,0,.5)}

.sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--glass);border:1px solid var(--glass-border);border-bottom:none;
  backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);
  border-radius:24px 24px 0 0;
  box-shadow:var(--glass-inset),0 -8px 40px rgba(42,35,32,.18);
  padding:14px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform .32s var(--ease-spring),background-color .38s var(--ease-out),border-color .38s var(--ease-out);
  z-index:21;max-width:560px;margin:0 auto;max-height:85vh;overflow-y:auto;
  touch-action:pan-y;
}
.sheet.dragging{transition:none}
[data-theme="dark"] .sheet{box-shadow:var(--glass-inset),0 -8px 40px rgba(0,0,0,.4)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px;cursor:grab}
.sheet-handle:active{cursor:grabbing}
.sheet-close{position:absolute;top:14px;right:16px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(128,128,128,.12);color:var(--ink2);font-size:15px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s var(--ease-out)}
.sheet-close:active{transform:scale(.86)}
.sheet label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px;margin-top:14px}
.sheet label:first-of-type{margin-top:0}
.sheet input[type="text"],.sheet select{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--glass-border);
  background:var(--surface);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);outline:none;
  transition:border-color .18s,var(--theme-t);
}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--rose-deep)}
.sheet textarea{
  width:100%;min-height:80px;border-radius:12px;border:1px solid var(--glass-border);
  background:var(--surface);padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;
  color:var(--ink);resize:vertical;outline:none;transition:border-color .18s,var(--theme-t);
}
.time-row{display:flex;gap:8px}
.time-row>div{flex:1}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{
  display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--glass-border);font-size:11.5px;font-weight:600;
  color:var(--ink2);cursor:pointer;transition:all .18s var(--ease-out);
}
.chip:active{transform:scale(.94)}
.chip i{width:7px;height:7px;border-radius:50%}
.chip.active{color:var(--ink);border-color:transparent;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.chip[data-c="blue"].active{background:rgba(124,147,168,.2);border-color:var(--tag-blue)}
.chip[data-c="purple"].active{background:rgba(150,115,143,.2);border-color:var(--tag-purple)}
.chip[data-c="gold"].active{background:rgba(199,163,76,.22);border-color:var(--tag-gold)}
.chip[data-c="green"].active{background:rgba(123,168,124,.2);border-color:var(--tag-green)}
.chip[data-c="coral"].active{background:rgba(196,114,108,.2);border-color:var(--tag-coral)}
.chip[data-c="rose"].active{background:rgba(232,196,184,.3);border-color:var(--tag-rose)}
.chip[data-c="terracotta"].active{background:rgba(184,115,85,.18);border-color:var(--tag-terra)}
[data-theme="dark"] .chip.active{box-shadow:var(--glow) currentColor}
.chip-add{padding:7px 11px;border-radius:999px;border:1.5px dashed var(--line);background:transparent;font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:transform .12s var(--ease-out)}
.chip-add:active{transform:scale(.94)}

.sheet-actions{display:flex;gap:8px;margin-top:16px}
.btn-primary{
  flex:1;padding:13px;border-radius:14px;border:none;
  background:var(--terracotta);color:#F5EFE8;font-family:'Inter',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 14px -3px rgba(184,115,85,.4);
  transition:transform .12s var(--ease-out);
}
[data-theme="dark"] .btn-primary{box-shadow:0 4px 20px -4px rgba(184,115,85,.5)}
.btn-primary:active{transform:scale(.96)}
.btn-danger{
  padding:13px 18px;border-radius:14px;border:1px solid rgba(196,114,108,.3);
  background:rgba(196,114,108,.08);color:var(--tag-coral);font-family:'Inter',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;transition:transform .12s var(--ease-out);
}
.btn-danger:active{transform:scale(.96)}

/* --- Toast --- */
.toast{
  position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;
  box-shadow:0 8px 24px rgba(42,35,32,.3);opacity:0;transition:all .28s var(--ease-out);z-index:30;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* --- Pull-to-refresh indicator --- */
.ptr{
  position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%) translateY(-30px);
  width:32px;height:32px;border-radius:50%;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--glass-inset),var(--glass-sh);
  display:flex;align-items:center;justify-content:center;
  color:var(--terracotta);font-size:14px;font-weight:700;
  opacity:0;transition:none;z-index:15;pointer-events:none;
}
.ptr.spinning{animation:ptrSpin .8s linear infinite}
@keyframes ptrSpin{to{transform:translateX(-50%) translateY(20px) rotate(360deg)}}

/* --- Tag manager --- */
.color-opt{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:border-color .15s,transform .12s var(--ease-out)}
.color-opt:active{transform:scale(.84)}
.color-opt.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg)}

/* --- FAB --- */
.fab{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:20px;
  width:52px;height:52px;border-radius:50%;border:none;
  background:var(--terracotta);color:#F5EFE8;font-size:26px;
  box-shadow:0 6px 20px -4px rgba(184,115,85,.5);cursor:pointer;z-index:10;
  display:flex;align-items:center;justify-content:center;
  transition:transform .14s var(--ease-out);
  animation:slideUp .5s var(--ease-out) both;animation-delay:.3s;
}
[data-theme="dark"] .fab{box-shadow:0 4px 24px -4px rgba(184,115,85,.6)}
.fab:active{transform:scale(.86)}

/* --- Footer --- */
footer{margin-top:24px;padding:16px 20px calc(10px + env(safe-area-inset-bottom));text-align:center}
footer .rule{width:28px;height:1px;background:var(--rose-deep);margin:0 auto 8px}
footer p{font-family:'Fraunces',serif;font-style:italic;font-size:11.5px;color:var(--ink2)}
</style>
</head>
<body>
<div id="auth-shell" hidden></div>
<div id="app-shell" hidden>
<div class="app-utility-bar">
  <span class="sync-dot" id="syncDot" data-status="offline" title="Estado de sincronización"></span>
  <div id="themeMenuMount"></div>
  <button class="theme-toggle" id="settingsBtn" aria-label="Ajustes">⚙️</button>
</div>
<div class="app-layout" id="appLayout" data-tab="hoy">

  <nav class="app-panel panel-quick quick-actions" id="panelQuick">
    <button class="quick-btn" id="quickAddTask" aria-label="Nueva tarea" title="Nueva tarea">✓<span>+</span></button>
    <button class="quick-btn" id="quickAddMateria" aria-label="Nueva materia" title="Nueva materia">📚<span>+</span></button>
    <button class="quick-btn" id="quickAddNota" aria-label="Nueva nota" title="Nueva nota">📝<span>+</span></button>
  </nav>

  <div class="app-panel panel-hoy" id="panelHoy">
    <header class="hero">
      <div class="hero-left"><p class="eyebrow">Mi Horario</p><h1>Hoy</h1></div>
    </header>
    <div class="today-card" id="todayCard"></div>
    <div id="todayCountdown"></div>
    <div class="sec-head"><span class="sec-title">Tareas de hoy</span></div>
    <div id="todayTasks" class="tasks-bucket"></div>
    <div class="sec-head"><span class="sec-title">Clases de hoy</span></div>
    <div id="todayClasses" class="tasks-bucket"></div>
    <footer><div class="rule"></div><p>una semana, a su tiempo</p></footer>
  </div>

  <div class="app-panel panel-materias" id="panelMaterias">
    <div class="sec-head" style="padding-top:calc(20px + env(safe-area-inset-top))"><span class="sec-title">Materias</span></div>
    <input class="materias-search" id="materiasSearch" placeholder="Buscar materia…" type="text">
    <div class="materias-grid" id="materiasGrid"></div>
    <p class="materias-empty" id="materiasEmpty" hidden>Aún no tienes materias. Agrega la primera con el botón +.</p>
    <button class="fab-add-materia" id="addMateriaBtn" aria-label="Agregar materia">+</button>
  </div>

  <div class="app-panel panel-semana" id="panelSemana">
    <div class="today-card today-card-desktop" id="todayCardDesktop"></div>
    <div class="schedule-header">
      <div><h2 id="scheduleName">Mi horario</h2><p class="sh-credits" id="scheduleCredits"></p></div>
      <div class="schedule-header-actions">
        <button class="sh-btn" id="switchScheduleBtn">🗂️</button>
        <button class="sh-btn" id="addEventBtn">+ Evento</button>
        <button class="sh-btn" id="exportBtn">Exportar</button>
        <button class="sh-btn" id="shareBtn">Compartir</button>
      </div>
    </div>
    <div class="week-nav">
      <button class="week-nav-btn" id="weekPrev" aria-label="Semana anterior">‹</button>
      <span class="week-nav-label" id="weekLabel"></span>
      <button class="week-nav-btn" id="weekNext" aria-label="Semana siguiente">›</button>
    </div>
    <div class="week-row"><div class="week-bar"><div class="week-fill" id="weekFill"></div></div><span class="week-lbl" id="weekLbl"></span></div>
    <div class="cal-wrap" id="calWrap"><div class="cal-inner"><div class="cal-grid" id="calGrid"></div></div></div>
    <div id="notesSection"></div>
    <button class="today-float-btn" id="todayFloatBtn">Hoy</button>
  </div>

  <div class="app-panel panel-tareas" id="panelTareas">
    <div class="sec-head" style="padding-top:calc(20px + env(safe-area-inset-top))"><span class="sec-title">Tus tareas</span><button class="add-btn" id="addTaskBtn" aria-label="Agregar">+</button></div>
    <div id="tasksBuckets"></div>
  </div>

</div>

<nav class="tab-bar" id="tabBar">
  <button class="tab-bar-btn" data-tab="hoy"><span class="tab-icon">☀️</span>Hoy</button>
  <button class="tab-bar-btn" data-tab="semana"><span class="tab-icon">📅</span>Semana</button>
  <button class="tab-bar-btn" data-tab="materias"><span class="tab-icon">📚</span>Materias</button>
  <button class="tab-bar-btn" data-tab="tareas"><span class="tab-icon">✓</span>Tareas</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="ptr" id="ptr">↓</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
